name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Generated types are up to date
        run: |
          cp worker-configuration.d.ts /tmp/before.d.ts
          printf 'GOOGLE_CLIENT_ID=\nGOOGLE_CLIENT_SECRET=\n' > .dev.vars
          npm run cf-typegen
          diff -q /tmp/before.d.ts worker-configuration.d.ts || (echo "Run 'npm run cf-typegen' and commit worker-configuration.d.ts" && exit 1)
      - name: Test
        run: npm test
      - name: Build (dry-run deploy)
        run: npx wrangler deploy --dry-run --outdir dist

  # Optional continuous deployment. Enable by adding repository secrets
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID and a repository variable
  # DEPLOY_ENABLED=true. Runs migrations, then deploys.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
